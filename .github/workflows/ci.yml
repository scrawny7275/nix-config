# .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history is the point
      - uses: cachix/install-nix-action@v31
      - name: gitleaks (full history)
        run: nix run nixpkgs#gitleaks -- git --redact=100 --log-level warn .
      - name: detect-secrets (tree)
        run: nix run nixpkgs#python3Packages.detect-secrets -- scan --exclude-files 'result$|/nix/store' .

  history-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: sensitive-path + credential-pattern scans (all objects)
        run: bash scripts/ci/scan-history.sh

  flake-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: finite eval gates
        run: bash scripts/ci/verify.sh
      - name: unit tests (nix flake check)
        run: nix flake check
